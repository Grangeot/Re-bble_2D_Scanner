:root{
  --bg:#fff;--fg:#000;--ink:#000;--on-ink:#fff;--muted:#7a7a7a;--line:#000;--hair:#cfcfcf;
  --soft:#d0d0d0;--dark:#4d4d4d;--on-dark:#fff;--dis:#bdbdbd;--chip:#ececec;
  --ok:#21c043;--ok-ink:#3be05a;--mid:#f0a500;--bad:#ff3b30;--outline:#2fe05a;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fff;--ink:#fff;--on-ink:#000;--muted:#9a9a9a;--line:#fff;--hair:#3a3a3a;--soft:#5c5c5c;--dark:#a8a8a8;--on-dark:#000;--dis:#3d3d3d;--chip:#1c1c1c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--fg:#fff;--ink:#fff;--on-ink:#000;--muted:#9a9a9a;--line:#fff;--hair:#3a3a3a;--soft:#5c5c5c;--dark:#a8a8a8;--on-dark:#000;--dis:#3d3d3d;--chip:#1c1c1c;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 JBM,ui-monospace,"SF Mono",Menlo,Consolas,monospace;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--outline);outline-offset:2px}
#app{height:100%;max-width:480px;margin:0 auto;border-left:1px solid var(--hair);border-right:1px solid var(--hair)}
@media (max-width:481px){#app{border:0}}
.screen{height:100%;display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.scroll{flex:1;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
.pad{padding:14px 20px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;flex:none}
.muted{color:var(--muted)}.small{font-size:12px}.center{text-align:center}
b{font-weight:700}
/* headers */
.title{text-align:center;font-size:16px;letter-spacing:.04em;padding:16px 0 12px;border-bottom:1px solid var(--line)}
.hdr{display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:58px}
.hdr-t{flex:1;text-align:center;font-weight:700;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibtn{width:34px;height:34px;display:grid;place-items:center;flex:none}
.ibtn .boxed{width:26px;height:26px;border:2px solid currentColor;padding:2px;stroke-width:2.4}
.ibtn.info{background:var(--dark);color:var(--on-dark);width:26px;height:26px}
.ibtn.info .ic{width:18px;height:18px}
.ptitle{flex:1;min-width:0;text-align:center;font-size:15px;letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;border:1.5px solid var(--hair);background:var(--bg)}
.ptitle:focus{border-color:var(--line);outline:0}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--ink);color:var(--on-ink);min-height:36px;padding:0 14px;font-size:13px;letter-spacing:.03em}
.bar>:first-child{justify-self:start}.bar>:last-child{justify-self:end}
.bar button{display:flex;align-items:center;gap:6px;color:var(--on-ink);font-size:13px;padding:6px 0}
.bar button:disabled{opacity:.4}
.bar .ic{width:17px;height:17px}
/* lists */
.sec-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;letter-spacing:.03em;margin:18px 0 8px}
.sec-h .ic{width:15px;height:15px}
.row{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--ink);color:var(--on-ink);padding:8px 18px;margin-bottom:8px;font-weight:700;min-height:34px;text-align:left;gap:10px}
.row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .date{font-weight:400;color:var(--on-ink);opacity:.82;white-space:nowrap}
.row.done{background:var(--dark);color:var(--on-dark)}
.row.done .date{color:var(--on-dark)}
.empty{text-align:center;padding:48px 28px}
.empty p{margin:0 0 10px}
.empty .btn{margin-top:14px}
.btn.big{min-height:64px;font-size:17px;padding:0 28px;margin-top:18px}
.okmsg+.btn.big{margin-top:6px}
.sub{margin:6px 0 0}
.donebox{border:2px solid var(--ok);padding:12px 14px 4px;margin:10px 0 6px}
.donebox .okmsg{margin:0 0 4px}
/* buttons */
.actions{padding:12px 20px;display:flex;gap:12px;border-top:1px solid var(--line)}
.actions.two>*{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--ink);color:var(--on-ink);min-height:46px;padding:0 14px;font-size:15px;letter-spacing:.02em;text-align:center;cursor:pointer;user-select:none}
.btn.sec{background:var(--dark);color:var(--on-dark)}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled,.btn[disabled]{background:var(--dis);color:var(--bg);cursor:default}
.btn.sm{min-height:34px;font-size:12px;padding:0 10px;gap:6px}
.btn.sm .ic{width:16px;height:16px}
.btn.wide{width:100%}
.btnrow{display:flex;gap:10px;margin-top:16px}
.btnrow>*{flex:1}
.btnrow.col{flex-direction:column}
label.btn{position:relative;overflow:hidden}
/* tabbars */
.tabbar{display:flex;border-top:1px solid var(--line);padding:6px 0 4px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--dis);padding:6px 0}
.tab .ic{width:24px;height:24px;stroke-width:1.6}
.tab.on{color:var(--ink)}
.stages{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 6px}
.stage{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--dis);min-width:62px}
.stage .ic{width:22px;height:22px}
.stage.on{color:var(--ink)}
.stage:disabled{opacity:.6}

/* segmented */
.seg{display:flex;border:1.5px solid var(--line);margin:0}

/* grid of cards */

.card{min-width:0}
.card-l.kvl{display:flex;justify-content:space-between;padding:3px 6px;font-size:10.5px;gap:4px}

.grid.sm{padding:4px 0;max-height:60vh;overflow-y:auto}
.card{position:relative;display:flex;flex-direction:column;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
.card-img{display:block;aspect-ratio:1;padding:8%;color:var(--ink)}

.ratio{background:#000;color:#fff;padding:8px 16px 9px;font-size:13px}

.ratio-bar{position:relative;height:5px;background:#4d4d4d;margin:7px 0 5px}

/* drawings */

.ebtns.e5{grid-template-columns:repeat(5,1fr);margin-top:6px}
.wdash{fill:none;stroke:var(--muted);stroke-dasharray:22 16}
.wop{fill:var(--bg);stroke:var(--ink)}

.mline{stroke:var(--ink)}
.mini{width:100%;height:100%;display:block}

/* ---------- IndexedDB ---------- */
const DB = {
  db: null, ok: false,
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('muro', 1);
        r.onupgradeneeded = () => { const d = r.result; for (const s of ['kv', 'locations', 'pieces', 'projects', 'images']) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); };
        r.onsuccess = () => { this.db = r.result; this.ok = true; res(true); };
        r.onerror = () => res(false);
      } catch (e) { res(false); }
    });
  },
  tx(store, mode, fn) {
    if (!this.ok) return Promise.resolve(null);
    return new Promise((res, rej) => {
      try {
        const tr = this.db.transaction(store, mode), st = tr.objectStore(store), q = fn(st);
        tr.oncomplete = () => res(q && q.result); tr.onerror = () => rej(tr.error);
      } catch (e) { rej(e); }
    });
  },
  all(store) { return this.tx(store, 'readonly', s => s.getAll()).then(r => r || []); },
  get(store, id) { return this.tx(store, 'readonly', s => s.get(id)); },
  put(store, obj) { return this.tx(store, 'readwrite', s => s.put(JSON.parse(JSON.stringify(obj, (k, v) => k.startsWith('_') ? undefined : v)))).catch(e => toast(t('Could not save: ') + e.message)); },
  del(store, id) { return this.tx(store, 'readwrite', s => s.delete(id)); }
};

/* ---------- EXIF capture time (DateTimeOriginal) ---------- */
async function exifTime(file) {
  try {
    const buf = new DataView(await file.slice(0, 256 * 1024).arrayBuffer());
    if (buf.getUint16(0) !== 0xFFD8) return null;
    let o = 2;
    while (o < buf.byteLength - 4) {
      const mk = buf.getUint16(o), len = buf.getUint16(o + 2);
      if (mk === 0xFFE1 && buf.getUint32(o + 4) === 0x45786966) {
        const t = o + 10, le = buf.getUint16(t) === 0x4949, u16 = p => buf.getUint16(p, le), u32 = p => buf.getUint32(p, le);
        const readStr = (p, n) => { let r = ''; for (let i = 0; i < n - 1; i++) r += String.fromCharCode(buf.getUint8(p + i)); return r; };
        const scan = (ifd, want) => { const n = u16(t + ifd); for (let i = 0; i < n; i++) { const e = t + ifd + 2 + i * 12, tag = u16(e); if (want[tag]) want[tag](e); } };
        let dt = null, sub = null;
        scan(u32(t + 4), { 0x0132: e => { dt = readStr(t + u32(e + 8), 20); }, 0x8769: e => { sub = u32(e + 8); } });
        if (sub) scan(sub, { 0x9003: e => { dt = readStr(t + u32(e + 8), 20); } });
        if (!dt) return null;
        const m = dt.match(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
        return m ? new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]).getTime() : null;
      }
      if ((mk & 0xFF00) !== 0xFF00) break;
      o += 2 + len;
    }
  } catch (e) { }
  return null;
}

// geometry used for packing and clearance checks: prefab panels also reserve their lifting notches
// Prefab: rubble stays inside the peripheral reinforcement (cover + bar + cover); bottom bar runs straight above the notches
function stackBounds(pr) {

  const st = S.settings, c = st.rebarCoverMm || 20, d = st.rebarDiaMm || 10, side = 2 * c + d, bottom = (st.notchHMm || 30) + 10 + d + c;
  return { x0: side, y0: bottom, x1: pr.wall.w - side, y1: pr.wall.h - side, infl: side };
}
const projGeo = pr => {
  const B = stackBounds(pr), lint = typeof lintelRects === 'function' ? lintelRects(pr) : [], base = [...(pr.openings || []), ...lint];
  if (!B) return lint.length ? { ...pr, openings: base } : pr;
  return { ...pr, bounds: B, openings: base.map(o => ({ x: o.x - B.infl, y: o.y - B.infl, w: o.w + 2 * B.infl, h: o.h + 2 * B.infl })) };
};
// SVG path of the stacking boundary (Y maps wall y-up to svg y)
function boundsPath(pr, Y) {
  const B = stackBounds(pr); if (!B) return '';

  const ops = projGeo(pr).openings, n = ops.length, par = ops.map((_, i) => i), find = i => par[i] === i ? i : (par[i] = find(par[i]));
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) { const a = ops[i], b = ops[j]; if (a.x <= b.x + b.w && b.x <= a.x + a.w && a.y <= b.y + b.h && b.y <= a.y + a.h) par[find(i)] = find(j); }
  const isIn = o => o.x > B.x0 && o.y > B.y0 && o.x + o.w < B.x1 && o.y + o.h < B.y1, grpIn = new Map();
  ops.forEach((o, i) => { const r = find(i); grpIn.set(r, (grpIn.get(r) ?? true) && isIn(o)); });
  const inner = ops.filter((o, i) => grpIn.get(find(i)));
  const outer = rectRegion([B.x0, B.y0, B.x1, B.y1], ops.filter(o => !inner.includes(o)).map(o => [o.x, o.y, o.x + o.w, o.y + o.h]));
  let d = 'M' + outer.map(([x, y]) => `${fmt1(x)} ${fmt1(Y(y))}`).join('L') + 'Z';
  // touching or overlapping openings form one exclusion (boolean union)
  for (const loop of rectUnionLoops(inner.map(o => [o.x, o.y, o.x + o.w, o.y + o.h]))) d += 'M' + loop.map(([x, y]) => `${fmt1(x)} ${fmt1(Y(y))}`).join('L') + 'Z';
  return d;
}

// polygon path with rounded corners (radius r, clipped to half the shorter adjacent edge)
function roundedPath(pts, r, Y) {
  const n = pts.length, P = i => pts[(i + n) % n]; let d = '';
  for (let i = 0; i < n; i++) {
    const [x, y] = P(i), [ax, ay] = P(i - 1), [bx, by] = P(i + 1);
    const la = Math.hypot(ax - x, ay - y), lb = Math.hypot(bx - x, by - y), k = Math.min(r, la / 2, lb / 2);
    const p1 = [x + (ax - x) / la * k, y + (ay - y) / la * k], p2 = [x + (bx - x) / lb * k, y + (by - y) / lb * k];
    d += `${i ? 'L' : 'M'}${fmt1(p1[0])} ${fmt1(Y(p1[1]))}Q${fmt1(x)} ${fmt1(Y(y))} ${fmt1(p2[0])} ${fmt1(Y(p2[1]))}`;
  }

}

// outer outlines of the union of axis-aligned rectangles (touching rectangles merge)
function rectUnionLoops(rects) {
  if (!rects.length) return [];
  const xs = [...new Set(rects.flatMap(r => [r[0], r[2]]))].sort((a, b) => a - b), ys = [...new Set(rects.flatMap(r => [r[1], r[3]]))].sort((a, b) => a - b);
  const nx = xs.length - 1, ny = ys.length - 1, inside = (i, j) => { if (i < 0 || j < 0 || i >= nx || j >= ny) return false; const cx = (xs[i] + xs[i + 1]) / 2, cy = (ys[j] + ys[j + 1]) / 2; return rects.some(r => cx > r[0] && cx < r[2] && cy > r[1] && cy < r[3]); };
  const next = new Map(), key = (x, y) => x + ',' + y;
  for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) if (inside(i, j)) {
    const x0 = xs[i], x1 = xs[i + 1], y0 = ys[j], y1 = ys[j + 1];
    if (!inside(i, j - 1)) next.set(key(x0, y0), [x1, y0]); if (!inside(i + 1, j)) next.set(key(x1, y0), [x1, y1]);
    if (!inside(i, j + 1)) next.set(key(x1, y1), [x0, y1]); if (!inside(i - 1, j)) next.set(key(x0, y1), [x0, y0]);
  }
  const loops = [], seen = new Set();
  for (const k0 of next.keys()) {
    if (seen.has(k0)) continue; const loop = []; let k = k0, g = 0;
    while (!seen.has(k) && g++ < 10000) { seen.add(k); const [x, y] = k.split(',').map(Number); loop.push([x, y]); const n = next.get(k); if (!n) break; k = key(n[0], n[1]); }

  }
  return loops;
}

async function openPiece(pid, ctx = {}) {

function photoWithOverlay(p, img, opts = {}) {
  // image crop in mm space: viewBox = image px; polygon from mm*ppm
  if (!img) return `<div class="ph-wait">${t('Loading photo…')}</div>`;
  const W = p.imgW, H = p.imgH, k = p.ppm;
  let over = '';
  if (opts.outline !== false) over += `<polygon points="${p.poly.map(([x, y]) => `${fmt1(x * k)},${fmt1(y * k)}`).join(' ')}" class="ol"/>`;
  let toImgL = q => q, cxL = 0, cyL = 0;
  if (opts.lift) {
    const c = G.centroid(p.poly); toImgL = ([lx, ly]) => [(lx + c[0]) * k, (-ly + c[1]) * k]; cxL = c[0] * k; cyL = c[1] * k;
    const toImg = ([lx, ly]) => [(lx + c[0]) * k, (-ly + c[1]) * k];
    const r = Math.max(W, H) / 40;
    for (const pt of opts.lift.local) { const [x, y] = toImg(pt), q = r * 0.75; over += opts.lift.cross ? (d0 => `<path d="${d0}" class="lpx-o"/><path d="${d0}" class="lpx"/>`)(`M${fmt1(x - q)},${fmt1(y - q)}L${fmt1(x + q)},${fmt1(y + q)}M${fmt1(x + q)},${fmt1(y - q)}L${fmt1(x - q)},${fmt1(y + q)}`) : `<circle cx="${fmt1(x)}" cy="${fmt1(y)}" r="${fmt1(r)}" class="lp"/><circle cx="${fmt1(x)}" cy="${fmt1(y)}" r="${fmt1(r / 3)}" class="lpc"/>`; }
    if (opts.lift.up) {
      const [ux, uy] = opts.lift.up, cx = c[0] * k, cy = c[1] * k, L = Math.min(W, H) * 0.28;
      const ex = cx + ux * L, ey = cy - uy * L;
      over += arrowPath(cx, cy, ex, ey, r);
    }
  }
  const px = (opts.pad || 0) * W, py = (opts.pad || 0) * H;
  if (opts.kg && opts.lift) { const r = Math.max(W, H) / 22; over += `<text x="${fmt1(W / 2)}" y="${fmt1(-py * 0.35)}" font-size="${fmt1(r)}" text-anchor="middle" class="kgl">~${Math.round(opts.kg)} kg</text>`; }
  if (opts.lift) { const R = Math.max(W, H) / 12; over += `<g data-a="lift-legend" class="lhit">${opts.lift.local.map(pt => { const [x, y] = toImgL(pt); return `<circle cx="${fmt1(x)}" cy="${fmt1(y)}" r="${fmt1(R)}"/>`; }).join('')}<circle cx="${fmt1(cxL)}" cy="${fmt1(cyL)}" r="${fmt1(R * 1.3)}"/></g>`; }
  return `<div class="photo"><svg viewBox="${fmt1(-px)} ${fmt1(-py)} ${fmt1(W + 2 * px)} ${fmt1(H + 2 * py)}" preserveAspectRatio="xMidYMid meet"><rect x="${fmt1(-px)}" y="${fmt1(-py)}" width="${fmt1(W + 2 * px)}" height="${fmt1(H + 2 * py)}" fill="#000"/><image href="${img.crop}" width="${W}" height="${H}"/>${over}</svg>${opts.flip ? `<span class="flipbadge">${icon('flip')} ${t('FLIP OVER')}</span>` : ''}</div>`;
}
// one closed outline: round bulge at the start, shaft, arrowhead (black fill, white stroke all around)
function arrowPath(x0, y0, x1, y1, r) {
  const L = Math.hypot(x1 - x0, y1 - y0) || 1, ux = (x1 - x0) / L, uy = (y1 - y0) / L, nx = -uy, ny = ux;
  const w = r * 0.32, rc = r * 0.75, hl = r * 1.5, hw = r * 0.95, a = Math.sqrt(rc * rc - w * w);
  const P = (s2, t2) => `${fmt1(x0 + ux * s2 + nx * t2)} ${fmt1(y0 + uy * s2 + ny * t2)}`;
  const ang = (s2, t2) => Math.atan2(uy * s2 + ny * t2, ux * s2 + nx * t2);
  let dlt = ang(a, w) - ang(a, -w); while (dlt < 0) dlt += 2 * Math.PI;
  const sweep = dlt > Math.PI ? 1 : 0;
  return `<path d="M${P(a, w)}L${P(L - hl, w)}L${P(L - hl, hw)}L${P(L, 0)}L${P(L - hl, -hw)}L${P(L - hl, -w)}L${P(a, -w)}A${fmt1(rc)} ${fmt1(rc)} 0 1 ${sweep} ${P(a, w)}Z" class="uparrow"/>`;
}

}

    pr.wall = { w: h, h: w }; pr.openings = (pr.openings || []).map(o => ({ x: o.y, y: o.x, w: o.h, h: o.w })); for (const o of pr.openings) clampOpening(pr, o); invalidateDesigns(pr); saveProject(pr); render(); },
  'thk-sug': el => { const inp = $('[data-a=scan-thick]'); if (!inp) return; inp.value = el.dataset.v; S.ui.ov.cur.thickness = el.dataset.v; inp.closest('.kv') && inp.closest('.kv').classList.remove('needt'); const sg = $('.thsug'); if (sg) sg.hidden = true; },
  'backup-now': () => { closeModal(); A['export-data'](); },
  'backup-later': () => { S.meta.remindAfter = Date.now() + 864e5; saveMeta(); closeModal(); },
  joints: () => { S.ui.joints = !S.ui.joints; render(); },
  'co2-info': () => { const pr = curP(), d = activeDesign(pr), l = lcaFor(pr, d), m = dm(pr, d);
    modal(`<h3 class="modal-h">${t('CARBON FOOTPRINT')}</h3><p class="modal-text small">${t('Embodied emissions (stages A1–A4 and C2–C4) of this wall compared with a precast reinforced concrete wall with 50% recycled aggregates of the same size. Inputs: net area')} ${fmt2(m2(m.netArea))} m², ${t('thickness')} ${cm(m.thickness)} cm, ${t('void ratio')} ${Math.round(m.fvr * 100)}%, ${pr.fabrication === 'prefab' ? t('prefabrication in a precast plant with rubble from a nearby recycling centre') : t('on-site construction reusing rubble from the site')}.</p>
      <div class="kv"><span>${t('This wall')}</span><b>${fmt1(l.wallM2)} kgCO₂e/m²</b></div><div class="kv"><span>${t('Recycled concrete wall')}</span><b>${fmt1(l.refM2)} kgCO₂e/m²</b></div><div class="kv"><span>${t('Reduction')}</span><b>${Math.round(l.reduction * 100)}%</b></div>
      <p class="small ref"><a href="${LCA.DOI}" target="_blank" rel="noopener">${t('Based on scientific literature')} ↗</a></p>
      <div class="btnrow"><button class="btn" data-a="modal-close">${t('CLOSE')}</button></div>`, { focus: false }); },
  cpreview: () => { S.ui.stage = 'design'; S.ui.sub = 'preview'; S.ui.prog = 1; render(); },
  'scan-to-lib': () => { const o = S.ui.ov; S.ui.ov = null; renderOv(); backupReminder(o); if (S.ui.view === 'project') setStage('library'); showScannedStock(o, true); },
  coords: () => { S.ui.coords = !S.ui.coords; render(); },
  'cf-cast': () => { const pr = curP(), v = parseFloat($('#cf-c').value); if (!(v > 10)) return toast(t('Enter a valid height.')); pr.constr.params = { ...constrParams(pr), castMm: v }; S.settings.prefabFormworkMm = v; saveSettings(); for (const d of pr.designs || []) delete d._m; saveProject(pr); closeModal(); render(); },
  cnext: () => { const pr = curP(), c = cbuild(pr); if (c.steps[pr.constr.step || 0] && c.steps[pr.constr.step || 0].type === 'prepare' && !S.ui.found) { S.ui.found = true; render(); const m0 = $('#app main.scroll'); if (m0) m0.scrollTop = 0; return; } { const cur = c.steps[pr.constr.step || 0]; if (cur && cur.type === 'place') { pr.constr.log = { ...(pr.constr.log || {}), [cur.pid]: Date.now() }; } } pr.constr.step = Math.min(c.steps.length - 1, (pr.constr.step || 0) + 1); S.ui.found = false; S.ui.cphoto = false; saveProject(pr); render(); $('#app main.scroll') && ($('#app main.scroll').scrollTop = 0); },
  cprev: () => { const pr = curP(), c0 = cbuild(pr); if (!(pr.constr.step || 0) && !S.ui.found) { S.ui.stage = 'design'; S.ui.sub = 'preview'; pr.stage = 'design'; saveProject(pr); render(); return; } if (S.ui.found && c0.steps[pr.constr.step || 0].type === 'prepare') { S.ui.found = false; render(); return; } pr.constr.step = Math.max(0, (pr.constr.step || 0) - 1); S.ui.found = c0.steps[pr.constr.step].type === 'prepare'; S.ui.cphoto = false; saveProject(pr); render(); },
  found: () => { S.ui.found = !S.ui.found; render(); const m = $('#app main.scroll'); if (m) m.scrollTop = 0; },
  cphoto: () => { S.ui.cphoto = !S.ui.cphoto; render(); },
  'step-info': el => stepInfo(el.dataset.v),
  'save-note': el => { const pr = curP(); pr.notes = { ...(pr.notes || {}), [el.dataset.v]: $('#stepnote').value }; saveProject(pr); closeModal(); toast(t('Notes saved.')); },
  finish: () => { const pr = curP(); if (pr.status === 'done') return reportPDF(pr); confirmBox(t('Mark this structure as completed? Its pieces will be moved to the USED list.'), t('FINISH'), () => finishProject(pr)); },
  // settings
  'setting-seg': el => { S.settings[el.dataset.k] = el.dataset.v; if (el.dataset.k === 'markerSet') applyMarkerSizes(); saveSettings(); render(); if (S.ui.ov) renderOv(); },
  'setting-toggle': el => { S.settings[el.dataset.k] = !S.settings[el.dataset.k]; saveSettings(); render(); },
  'reset-settings': () => confirmBox(t('Restore all settings to their defaults?'), t('RESET'), () => { const notes = S.settings.stepNotes; S.settings = { ...DEFAULTS, stepNotes: notes }; saveSettings(); render(); }),
  'wipe-data': () => confirmBox(t('Delete all structures, locations, pieces and photos from this device?'), t('DELETE ALL'), async () => {
    for (const st of ['projects', 'pieces', 'images', 'locations', 'kv']) for (const r of await DB.all(st)) await DB.del(st, r.id);
    location.reload();
  }, true),
  'export-data': async () => {
    toast(t('Preparing backup…'));
    const images = await DB.all('images');
    const data = { app: 'muro', version: 1, exported: Date.now(), settings: S.settings, meta: S.meta, locations: Object.values(S.locations), pieces: Object.values(S.pieces).map(p => ({ ...p, _local: undefined, _area: undefined })), projects: Object.values(S.projects), images };
    saveFile(`muro-backup-${fmtDate(Date.now()).replace(/\./g, '-')}.json`, new Blob([JSON.stringify(data)], { type: 'application/json' }));
  }
};
// after scanning, show the stock that just received the pieces
function showScannedStock(o, force) {
  if (!o || (!o.done && !force)) return render();
  if (S.ui.view === 'project') {
    const pr = curP();
    if (o.done && pr.locationId !== o.loc) { if (!(pr.selected || []).length && !(pr.designs || []).length) { setStock(pr, o.loc); toast(t('This wall now uses the stock') + ' ' + S.locations[o.loc].name, 4000); } else toast(t('Pieces were added to') + ' ' + S.locations[o.loc].name, 4000); }
    return render();
  }
  S.ui.tab = 'library'; S.ui.libLoc = S.ui.lastLibLoc = o.loc; S.ui.libStatus = 'stock'; render();
}
// designs may only use selected pieces: deselected pieces are taken out of every stacking option
function dropUnselected(pr) {
  const sel = new Set(pr.selected || []);
  for (const d of pr.designs || []) { const n = d.placements.length; d.placements = d.placements.filter(x => sel.has(x.pid)); if (d.placements.length !== n) { delete d._m; delete d._jp; if (!d.manual) d.edited = true; } }
}
function deletePiece(id) {
  delete S.pieces[id]; delete S.imgCache[id]; DB.del('pieces', id); DB.del('images', id);
  for (const pr of Object.values(S.projects)) if ((pr.selected || []).includes(id)) { pr.selected = pr.selected.filter(x => x !== id); for (const d of pr.designs || []) { d.placements = d.placements.filter(x => x.pid !== id); delete d._m; } saveProject(pr); }
}
const INPUT = {
  setting: el => { const v = parseFloat(el.value); if (isNaN(v)) return; S.settings[el.dataset.k] = v; saveSettings(); for (const pr of Object.values(S.projects)) for (const d of pr.designs || []) delete d._m; },
  'setting-opt': el => { S.settings[el.dataset.k] = el.value === '' ? '' : el.value; saveSettings(); },
  'setting-text': el => { S.settings[el.dataset.k] = el.value.trim(); saveSettings(); if (el.dataset.k === 'currency') $$('.cur').forEach(c => c.textContent = S.settings.currency); },
  rename: el => { const pr = curP(); pr.name = el.value.trim() || pr.name; saveProject(pr); },
  'wall-range': el => { const pr = curP(); pr.wall[el.dataset.k] = +el.value; for (const o of pr.openings || []) clampOpening(pr, o); configLive(pr); },
  'piece-thick': el => { const p = S.pieces[el.dataset.id], v = parseFloat(el.value); p.thickness = v > 0 ? v : null; savePiece(p); for (const pr of Object.values(S.projects)) for (const d of pr.designs || []) delete d._m; },
  'scan-thick': el => { S.ui.ov.cur.thickness = el.value; },
  'area-range': () => syncDual(),
  'df-range': el => { const b = $(el.dataset.k === 'v' ? '#dfv' : '#dfq'); if (b) b.textContent = el.value + '%'; },
  'ul-op': el => { const pr = curP(); pr.underlay.op = +el.value; configLive(pr); saveProject(pr); },
  prog: el => { S.ui.prog = +el.value / Math.max(1, +el.max); updatePreviewProgress(); },
  'cparam': el => { const pr = curP(), v = parseFloat(el.value); if (!(v > 0)) return; pr.constr.params = { ...constrParams(pr), [el.dataset.k]: v }; saveProject(pr); }
};
const CHANGE = {
  'wall-range': el => { const pr = curP(); invalidateDesigns(pr); saveProject(pr); render(); },
  'wall-num': el => { const pr = curP(), v = parseFloat(el.value); if (!(v > 0)) return render(); pr.wall[el.dataset.k] = clamp(Math.round(v) * 10, 300, 20000); for (const o of pr.openings || []) clampOpening(pr, o); invalidateDesigns(pr); saveProject(pr); render(); },
  'thick-num': el => { const pr = curP(), v = parseFloat(el.value); if (v > 0) { pr.thickness = Math.round(v * 10); for (const d of pr.designs || []) delete d._m; saveProject(pr); } render(); },
  'proj-loc': el => { const pr = curP(); pr.locationId = el.value; pr.selected = []; invalidateDesigns(pr); saveProject(pr); S.meta.lastLoc = el.value; saveMeta(); render(); },
  'op-num': el => { const pr = curP(), o = pr.openings[+el.dataset.i], v = parseFloat(el.value); if (!isNaN(v)) { o[el.dataset.k] = v * 10; clampOpening(pr, o); invalidateDesigns(pr); saveProject(pr); } render(); },
  setting: () => render(),
  'mk-set': el => { const v = parseFloat(el.value), k = el.dataset.k; if (v > 10) { S.settings.markerMm = { ...(S.settings.markerMm || {}), [k]: v }; applyMarkerSizes(); saveSettings(); } },
  'cast-num': el => { const pr = curP(), v = parseFloat(el.value); if (v > 0) { pr.castMm = Math.round(v * 10); for (const d of pr.designs || []) { delete d._m; } if (pr.constr && pr.constr.params) pr.constr.params.castMm = pr.castMm; saveProject(pr); } render(); },
  'scan-loc': el => {
    if (el.value === '__new') { el.value = S.ui.ov.loc; modal(`<h3 class="modal-h">${t('NEW STOCK')}</h3><label class="lbl" for="locname">${t('Name of the construction site or stock')}</label><input id="locname" type="text" placeholder="${t('e.g. Fribourg yard')}"><div class="btnrow"><button class="btn sec" data-a="modal-close">${t('CANCEL')}</button><button class="btn" data-a="scan-newloc">${t('CREATE')}</button></div>`); return; }
    S.ui.ov.loc = el.value;
  },
  'scan-files': el => { const fs = Array.from(el.files || []); el.value = ''; if (!fs.length) return; S.ui.ov.queue.push(...fs); if (S.ui.ov.stage !== 'processing' && S.ui.ov.stage !== 'review') processQueue(); else renderOv(); },
  'scan-sens': el => {
    const c = S.ui.ov.cur; c.sens = +el.value;
    const poly = outlineFromRect(c.rect, c.size, c.sens); if (poly && poly.length >= 3) { c.poly = poly; c.sel = null; } else toast(t('No outline at this sensitivity.'));
    renderOv();
  },
  cparam: () => render(),
  'geo-file': async el => {
    const f = el.files && el.files[0]; el.value = ''; if (!f) return; closeModal(); toast(t('Reading the drawing…'));
    try {
      const g = await GeoImport.readGeometry(f); if (!g) return toast(t('No wall geometry detected in this file. Nothing was imported or saved.'), 5000);
      S.ui.geoImport = g; const pr = curP();
      modal(`<h3 class="modal-h">${t('DRAWING READ')}</h3><p class="modal-text small">${t('Wall outline found with')} ${g.ops.length} ${t('opening(s). Proportions are kept; enter the real wall length to set the scale.')}</p>
        <div class="set-row"><label for="geow">${t('Real wall length')}</label><span class="inp sm"><input id="geow" type="number" inputmode="decimal" value="${cm(pr.wall.w)}"><em>cm</em></span></div>
        <div class="btnrow"><button class="btn sec" data-a="modal-close">${t('CANCEL')}</button><button class="btn" data-a="geo-apply">${t('APPLY')}</button></div>`, { focus: false });
    } catch (e) { toast(t('Could not read this file: ') + e.message, 5000); }
  },
  'ul-file': async el => {
    const f = el.files && el.files[0]; el.value = ''; if (!f) return; closeModal(); toast(t('Preparing the underlay…'));
    try { const u = await GeoImport.underlay(f), pr = curP(), w = pr.wall.w; pr.underlay = { url: u.url, op: 0.55, x: 0, y: 0, w, h: w * u.ratio, locked: false }; saveProject(pr); render(); toast(t('Drag the underlay into place, resize it from its corner, then lock it.'), 4500); }
    catch (e) { toast(t('Could not read this file: ') + e.message, 5000); }
  },
  'lintel-num': el => { const pr = curP(), v = parseFloat(el.value); if (v >= 0) { pr.lintel[el.dataset.k] = Math.round(v * 10); invalidateDesigns(pr); saveProject(pr); } render(); },
  'final-photo': async el => {
    const f = el.files && el.files[0]; el.value = ''; if (!f) return;
    const cv = await loadImageFile(f, 1600), pr = curP(), url = cv.toDataURL('image/jpeg', 0.82), taken = (await exifTime(f)) || f.lastModified || Date.now();
    const old = (await getImages('final-' + pr.id)) || null;
    const rec = old && old.crop ? { ...old, more: [...(old.more || []), { url, taken }] } : { id: 'final-' + pr.id, crop: url, taken, more: [] };
    S.imgCache[rec.id] = rec; await DB.put('images', rec); pr.photoDate = pr.photoDate || Date.now(); saveProject(pr); toast(t('Photo saved with the structure.')); render();
  },
  'import-data': async el => {
    const f = el.files && el.files[0]; el.value = ''; if (!f) return;
    try {
      const d = JSON.parse(await f.text()); if (d.app !== 'muro') throw new Error('not a Mūro backup');
      confirmBox(`${t('Import')} ${d.projects.length} ${t('structure(s) and')} ${d.pieces.length} ${t('piece(s)? Existing items with the same ID are replaced.')}`, t('IMPORT'), async () => {
        for (const l of d.locations) { S.locations[l.id] = l; await DB.put('locations', l); }
        for (const p of d.pieces) { S.pieces[p.id] = enrich(p); await DB.put('pieces', p); }
        for (const p of d.projects) { S.projects[p.id] = p; await DB.put('projects', p); }
        for (const i of d.images || []) await DB.put('images', i);
        for (const k of ['XS', 'S', 'M', 'L']) S.meta.counters[k] = Math.max(S.meta.counters[k] || 0, (d.meta.counters || {})[k] || 0);
        saveMeta(); toast(t('Backup imported.')); render();
      });
    } catch (e) { toast(t('Import failed: ') + e.message); }
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  if (el.tagName === 'INPUT' || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA') return;
  const f = A[el.dataset.a]; if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener('input', e => { const el = e.target.closest('[data-a]'); if (el && INPUT[el.dataset.a]) INPUT[el.dataset.a](el, e); });
document.addEventListener('change', e => { const el = e.target.closest('[data-a]'); if (el && CHANGE[el.dataset.a]) CHANGE[el.dataset.a](el, e); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal').classList.contains('open')) closeModal(); if (e.key === 'Enter' && e.target.id === 'locname') { (A['loc-create'] && $('[data-a=loc-create]') ? A['loc-create'] : A['loc-rename'])(); } });

(async function init() {
  await loadAll();
  if (!DB.ok) setTimeout(() => toast(t('Storage unavailable: data will be lost when you close this page.')), 600);
  // every change is saved as it happens; after a crash or reload, return to the last screen
  const ss = S.meta.session;
  if (ss && ss.view === 'project' && S.projects[ss.pid]) { S.ui.view = 'project'; S.ui.pid = ss.pid; S.ui.stage = ss.stage || S.projects[ss.pid].stage; S.ui.sub = ss.sub === 'edit' ? null : ss.sub; setTimeout(() => toast(t('Back where you left off')), 500); }
  else if (ss && ss.tab) { S.ui.tab = ss.tab; if (ss.libLoc && S.locations[ss.libLoc]) S.ui.libLoc = ss.libLoc; }
  render();
})();

</script>
